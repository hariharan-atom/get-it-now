name: get_it_now
description: Fresh groceries and everyday essentials, with a little more good.
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.1.19
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  cupertino_icons: ^1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - config/supabase.json
    - assets/onboarding/
    - assets/products/
  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue.ttf
          weight: 900
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
